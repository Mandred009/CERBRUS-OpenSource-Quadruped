cerbrus_sim:
  ros__parameters:
    # Simulation parameters
    timestep: 0.0005
    realtime_factor: 1.0
    
    # Standing pose
    standing_height: 0.28
    standing_pose:
      hip: 0.0
      thigh: 0.8
      calf: -1.6
    
    # PD gains (if using torque control)
    kp: 10000.0
    kd: 2000.0

cerbrus_controller:
  ros__parameters:
    control_rate: 100.0  # Hz